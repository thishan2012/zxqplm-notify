# BACKUP ONLY — normally the always-on daemon (src/daemon.js, e.g. on FPS.ms)
# handles bot commands with seconds-level latency. Run this manually ONLY if the
# daemon host is down: both consumers call getUpdates, so running this while the
# daemon is up will swallow updates / double-reply.
name: Subscribe — BACKUP (daemon normally handles commands)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Poll getUpdates and process commands
        run: node src/subscribe.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
