# schedules re-registered 2026-11-11 (GitHub scheduler re-registration workaround)
# GitHub disables scheduled workflows in public repos after 60 days of
# repository inactivity. This monthly heartbeat keeps the schedules alive.
name: Keepalive

on:
  schedule:
    - cron: '17 4 1 * *' # 04:17 on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          mkdir -p data
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartbeat.txt
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: heartbeat [skip ci]"
          git push
